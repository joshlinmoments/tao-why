<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>道場的十萬個為什麼</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-database-compat.js"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg:#111113; --surf:rgba(18,22,20,.72); --elev:rgba(22,28,24,.8);
      --bd:rgba(255,255,255,.08); --bd-hi:rgba(255,255,255,.16);
      --t1:#ECECEC; --t2:#9999AA; --t3:#525260;
      --acc:#7B61FF; --acc-hi:#9580FF;
      --gold:#F5A623; --gold-hi:#FFD060;
      --green:#34C759; --red:#FF453A;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0 }
    body {
      font-family:'Inter','Noto Sans TC',sans-serif; color:var(--t1);
      -webkit-font-smoothing:antialiased;
      background:linear-gradient(rgba(8,14,12,.73),rgba(8,14,12,.79)),url('bg.jpg') center/cover fixed;
    }
    .page { display:none; min-height:100dvh; flex-direction:column }
    .page.active { display:flex }
    .card { background:var(--surf); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--bd); border-radius:12px }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:9px 16px; border-radius:8px; font-family:inherit; font-weight:500; font-size:14px; line-height:1; border:none; cursor:pointer; transition:all .15s; white-space:nowrap }
    .btn-acc { background:var(--acc); color:#fff } .btn-acc:hover { background:var(--acc-hi); transform:translateY(-1px) }
    .btn-gold { background:var(--gold); color:#1a0f00; font-weight:700 } .btn-gold:hover { background:var(--gold-hi); transform:translateY(-1px) }
    .btn-green { background:var(--green); color:#fff } .btn-green:hover { filter:brightness(1.1) }
    .btn-ghost { background:rgba(30,36,32,.7); color:var(--t1); border:1px solid var(--bd); backdrop-filter:blur(8px) }
    .btn-ghost:hover { background:rgba(44,52,46,.8); border-color:var(--bd-hi) }
    .btn-danger { background:rgba(255,69,58,.1); color:var(--red); border:1px solid rgba(255,69,58,.2) }
    .btn:disabled { opacity:.35; cursor:not-allowed; transform:none!important; filter:none!important }
    .btn-lg { padding:13px 22px; font-size:15px; font-weight:600; border-radius:10px }
    .btn-xl { padding:16px 28px; font-size:17px; font-weight:700; border-radius:12px }
    .btn-full { width:100% }
    .inp { background:rgba(20,28,24,.75); backdrop-filter:blur(8px); border:1px solid var(--bd); border-radius:8px; color:var(--t1); font-family:inherit; font-size:14px; padding:9px 12px; outline:none; transition:border-color .15s; width:100% }
    .inp:focus { border-color:var(--acc) }
    .badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:99px; font-size:12px; font-weight:500 }
    .badge-acc { background:rgba(123,97,255,.12); color:var(--acc-hi); border:1px solid rgba(123,97,255,.2) }
    .badge-gold { background:rgba(245,166,35,.12); color:var(--gold); border:1px solid rgba(245,166,35,.2) }
    .badge-green { background:rgba(52,199,89,.12); color:var(--green); border:1px solid rgba(52,199,89,.2) }
    .slabel { font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--t3) }
    .hidden { display:none!important }
    .role-card { background:rgba(18,26,22,.68); backdrop-filter:blur(16px); border:1px solid var(--bd); border-radius:14px; padding:18px 20px; cursor:pointer; transition:all .2s }
    .role-card:hover { border-color:var(--bd-hi); background:rgba(28,40,32,.78); transform:translateY(-2px) }
    .icon-box { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0 }

    /* ── Display page ── */
    #page-display { --t1:#FFFFFF; --t2:#D8D8F0; --t3:#A0A0C0; --gold:#FFD060; --gold-hi:#FFE880; --acc:#A490FF; --acc-hi:#BBAAFF; --green:#4CD964; }
    .d-panel { display:none }
    .d-title { font-size:clamp(3rem,8vw,6rem); font-weight:700; line-height:1.1; text-shadow:0 0 40px rgba(255,255,255,.25) }
    .d-q { font-size:clamp(1.6rem,3.5vw,3rem); font-weight:600; line-height:1.5; text-shadow:0 0 20px rgba(255,255,255,.1) }
    .d-opt-label { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:clamp(1.5rem,3.5vw,2.5rem) }
    .d-opt-text { font-size:clamp(1.1rem,2.2vw,1.8rem); line-height:1.5 }
    .d-timer { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:clamp(4rem,14vw,10rem); line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 0 60px rgba(255,255,255,.3) }
    .d-hint { font-size:clamp(.9rem,2vw,1.5rem); color:var(--t3) }
    .d-unity { font-size:clamp(1.1rem,2.3vw,1.8rem); color:var(--t2); line-height:1.9; text-align:center; white-space:pre-line }
    .d-explain-text { font-size:clamp(1.2rem,2.4vw,2rem); line-height:2; color:var(--t2) }
    .d-classic-quote { font-size:clamp(1.8rem,4.5vw,3.6rem); font-weight:700; color:var(--t1); line-height:1.7; text-align:center }
    .d-classic-source { font-size:clamp(1rem,2.2vw,1.8rem); color:var(--acc-hi); font-weight:600; text-align:center }
    .d-supplement { font-size:clamp(1rem,2vw,1.6rem); color:var(--acc-hi); line-height:1.9; white-space:pre-line; text-align:center; font-style:italic }

    @keyframes fadeUp { from { opacity:0; transform:translateY(14px) } to { opacity:1; transform:translateY(0) } }
    @keyframes scaleIn { from { opacity:0; transform:scale(.95) } to { opacity:1; transform:scale(1) } }
    @keyframes pulseAcc { 0%,100% { box-shadow:0 0 0 0 rgba(123,97,255,.4) } 50% { box-shadow:0 0 0 12px rgba(123,97,255,0) } }
    .ani-up { animation:fadeUp .4s ease both }
    .ani-sc { animation:scaleIn .35s ease both }
    .pulse { animation:pulseAcc 2s infinite }
    ::-webkit-scrollbar { width:4px } ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); border-radius:4px }
  </style>
</head>
<body>


<!-- ═══════════════════════════════════════════════════
     HOME
════════════════════════════════════════════════════ -->
<div id="page-home" class="page active items-center justify-center p-5"
     style="background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(123,97,255,.1) 0%,transparent 70%)">
  <div style="max-width:420px;width:100%">
    <div class="text-center ani-up" style="margin-bottom:36px">
      <div style="width:60px;height:60px;border-radius:14px;background:rgba(123,97,255,.12);border:1px solid rgba(123,97,255,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 18px">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="11" stroke="#7B61FF" stroke-width="1.5"/><circle cx="14" cy="8.5" r="3" fill="#7B61FF"/><circle cx="14" cy="19.5" r="3" fill="none" stroke="#A490FF" stroke-width="1.5"/></svg>
      </div>
      <h1 style="font-size:22px;font-weight:700;color:var(--t1);margin-bottom:5px">道場的十萬個為什麼</h1>
      <p style="color:var(--t3);font-size:13px">線上智勇班第一期最後一堂課特別企劃</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="role-card ani-up" style="animation-delay:.08s;display:flex;align-items:center;gap:14px" onclick="nav('host')">
        <div class="icon-box" style="background:rgba(245,166,35,.12)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </div>
        <div style="flex:1"><div style="font-size:15px;font-weight:600;margin-bottom:2px">主持人</div><div style="color:var(--t3);font-size:12px">課程控制、計時、揭曉答案</div></div>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div class="role-card ani-up" style="animation-delay:.15s;display:flex;align-items:center;gap:14px" onclick="nav('display')">
        <div class="icon-box" style="background:rgba(123,97,255,.12)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7B61FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        </div>
        <div style="flex:1"><div style="font-size:15px;font-weight:600;margin-bottom:2px">大螢幕</div><div style="color:var(--t3);font-size:12px">分享此視窗給所有班員觀看</div></div>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>
    <p style="text-align:center;color:var(--t3);font-size:11px;margin-top:20px">💡 開兩個分頁：一個大螢幕（分享 Zoom）、一個主持人（自己看）</p>
  </div>
</div>


<!-- ═══════════════════════════════════════════════════
     HOST
════════════════════════════════════════════════════ -->
<div id="page-host" class="page" style="overflow-y:auto">
  <div style="max-width:500px;margin:0 auto;width:100%;padding:0 16px 80px">

    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px">
      <button onclick="nav('home')" class="btn btn-ghost" style="padding:7px 12px;font-size:13px;gap:5px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回
      </button>
      <span style="font-size:14px;font-weight:600">主持人控制台</span>
      <div id="h-status" class="badge badge-acc">等待中</div>
    </div>

    <!-- Lock -->
    <div id="host-lock" class="card" style="padding:20px;margin-bottom:10px">
      <p style="font-size:14px;font-weight:600;margin-bottom:12px">輸入主持人密碼</p>
      <div style="display:flex;gap:8px">
        <input id="host-pw" type="password" class="inp" placeholder="密碼"
               onkeydown="if(event.key==='Enter')unlockHost()">
        <button onclick="unlockHost()" class="btn btn-acc" style="flex-shrink:0">確認</button>
      </div>
      <div id="host-err" class="hidden" style="color:var(--red);font-size:13px;margin-top:8px">密碼錯誤，請重試</div>
    </div>

    <!-- Main (unlocked) -->
    <div id="host-main" class="hidden" style="flex-direction:column;gap:10px">

      <!-- Quick jump buttons -->
      <div class="card" style="padding:14px 16px">
        <span class="slabel" style="display:block;margin-bottom:10px">快速跳題</span>
        <div id="h-jump-btns" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>

      <!-- Question list -->
      <div class="card" style="padding:20px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
          <span class="slabel">課程題目</span>
          <span id="h-prog" class="badge badge-gold">0 / 6</span>
        </div>
        <div id="h-q-list" style="display:flex;flex-direction:column;gap:5px"></div>
      </div>

      <!-- Dynamic control panel -->
      <div id="h-controls" class="card" style="padding:20px"></div>

    </div>
  </div>
</div>


<!-- ═══════════════════════════════════════════════════
     DISPLAY
════════════════════════════════════════════════════ -->
<div id="page-display" class="page items-center justify-center relative overflow-hidden"
     style="background:radial-gradient(ellipse 100% 60% at 50% 0%,rgba(123,97,255,.05) 0%,transparent 60%)">

  <button onclick="nav('home')" class="btn btn-ghost"
          style="position:absolute;top:14px;left:14px;padding:7px 12px;font-size:12px;gap:5px;z-index:10">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回
  </button>

  <!-- ── IDLE ── -->
  <div id="d-idle" class="d-panel text-center ani-up" style="padding:32px">
    <div style="width:80px;height:80px;border-radius:20px;background:rgba(123,97,255,.1);border:1px solid rgba(123,97,255,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 28px">
      <svg width="40" height="40" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="11" stroke="#A490FF" stroke-width="1.5"/><circle cx="14" cy="8.5" r="3" fill="#A490FF"/><circle cx="14" cy="19.5" r="3" fill="none" stroke="#A490FF" stroke-width="1.5"/></svg>
    </div>
    <h1 class="d-title" style="color:var(--t1);margin-bottom:16px">道場的十萬個為什麼</h1>
    <p style="color:var(--t2);font-size:clamp(1.3rem,3vw,2.2rem);font-weight:600;margin-bottom:12px">線上智勇班第一期最後一堂課特別企劃</p>
    <p style="color:var(--t3);font-size:clamp(1rem,2vw,1.6rem)">等待課程開始…</p>
  </div>

  <!-- ── QUESTION ── -->
  <div id="d-question" class="d-panel"
       style="width:100%;max-width:1200px;padding:24px 36px;height:100dvh;flex-direction:column;justify-content:center">
    <div style="text-align:center;margin-bottom:clamp(.8rem,2.5vh,2rem)">
      <div id="d-q-badge" class="badge badge-acc"
           style="font-size:clamp(.8rem,1.5vw,1.1rem);padding:5px 14px;margin-bottom:clamp(.6rem,1.5vh,1.2rem)">心理測驗</div>
      <div id="d-q-text" class="d-q" style="color:var(--t1);max-width:960px;margin:0 auto"></div>
    </div>
    <div id="d-q-timer-wrap" style="display:none;text-align:center;margin-bottom:clamp(.5rem,1.5vh,1rem)">
      <div id="d-q-timer" class="d-timer" style="color:var(--gold)">01:30</div>
    </div>
    <div id="d-q-opts" style="display:flex;flex-direction:column;gap:clamp(.4rem,1.2vh,.8rem);max-width:860px;margin:0 auto;width:100%"></div>
    <p id="d-q-hint" class="d-hint" style="text-align:center;margin-top:clamp(.8rem,2.5vh,1.8rem)">💬 請在聊天室回覆</p>
  </div>

  <!-- ── REVEAL: 心理測驗（經典詞句揭示）── -->
  <div id="d-reveal-classic" class="d-panel"
       style="width:100%;max-width:1100px;padding:clamp(20px,3vw,40px) clamp(24px,4vw,60px);overflow-y:auto;max-height:100dvh">
  </div>

  <!-- ── EXPLAIN（開放題解答 + 圖片 / 影片）── -->
  <div id="d-explain" class="d-panel"
       style="width:100%;max-width:1200px;padding:clamp(20px,3vw,36px) clamp(24px,4vw,48px);overflow-y:auto;max-height:100dvh">
    <div id="d-explain-content" style="display:grid;gap:clamp(1rem,3vw,2.5rem)"></div>
  </div>

</div>


<script>
// ═══════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════
const HOST_PW = '000';

const Q = [
  // ── Q1 心理測驗（點選選項，顯示對應經典）───────────
  {
    id:1, badge:'心理測驗', type:'psych-classic',
    question:'如果用一個描述你最近內在心理狀態，你是哪一個呢？',
    timerSec:0,
    opts:[
      { label:'A',
        text:'即便經歷風風雨雨，仍對世間的一切保有熱情。',
        classic:'《孟子》',
        quote:'大人者，不失其赤子之心者也。' },
      { label:'B',
        text:'不給自己設限，全然交給上天及道場去安排，聽話照做準沒錯！',
        classic:'《道德經》',
        quote:'為天下谷，常德乃足，復歸於樸。\n樸散則為器，聖人用之，則為官長，故大制不割。' },
      { label:'C',
        text:'總能敞開心房去相信每個人都是善良沒有惡意的，包括自己也是。',
        classic:'《六祖壇經》',
        quote:'人雖有南北，佛性本無南北，\n獦獠身與和尚不同，佛性有何差別？' },
      { label:'D',
        text:'時時靜下心來，檢視自己的身心言行，有不好的必盡力去修改！',
        classic:'《舊約聖經·箴言 20:27》',
        quote:'人的靈是耶和華的燈，\n鑒察人的心腹。' },
    ]
  },

  // ── Q2 思考題（本性善良）────────────────────────
  {
    id:2, badge:'思考題', type:'open',
    question:'為什麼每個人的本性都是一樣善良的？明明我們每個人都有不一樣的個性。而且如果大家都是善良的，為什麼世界還會這麼亂？',
    timerSec:90,
    explain:{
      title:'《孟子•告子篇》牛山濯濯',
      text:'人見其禽獸也，而以為未嘗有才焉者，是豈人之情也哉？\n故苟得其養，無物不長；苟失其養，無物不消。\n\n孔子曰：「操則存，舍則亡；出入無時，莫知其鄉。」\n惟心之謂與？',
      image:'images/photo_q2.png',
      supplement:''
    }
  },

  // ── Q3 思考題（無為而為）────────────────────────
  {
    id:3, badge:'思考題', type:'open',
    question:'老子都說了「無為而為」，那為什麼我們修道還要這麼努力？',
    timerSec:90,
    explain:{
      title:'《道德經第 48 章》',
      text:'為學日益，為道日損。\n損之又損，以至於無為。\n無為而無不為矣。',
      image:'images/photo_q3.jpg',
      supplement:'師尊老大人慈悲聖訓\n\n對自己深刻的真誠　　才有愛而不礙的輕盈\n有愛而不礙的輕盈　　才有全面升級的可能\n有全面升級的可能　　才有持續真誠的從容'
    }
  },

  // ── Q4 思考題（功德天幣）────────────────────────
  {
    id:4, badge:'思考題', type:'open',
    question:'為什麼佛堂一直要我們做功德賺天幣，但是同時叫我們不要想自己賺多少功德呢？',
    timerSec:90,
    explain:{
      title:'《中庸》',
      text:'或生而知之，或學而知之，或困而知之，\n及其知之，一也；\n或安而行之，或利而行之，或勉強而行之，\n及其成功，一也。',
      image:'images/photo_q4.jpg',
      supplement:'球來就打'
    }
  },

  // ── Q5 思考題（影片 + 進階班）──────────────────
  {
    id:5, badge:'思考題', type:'video',
    question:'沒來上課的生活也可以很精彩啊，為什麼一定要來上進階班？',
    timerSec:90,
    explain:{
      video:'videos/pikmin.mp4',
      supplement:'七真馬丹陽大仙：\n真正健康的生活，不是永遠守著正確的習慣，\n而是真正步入常道的循環。'
    }
  },

  // ── Q6 使命題（師尊問洗澡）────────────────────
  {
    id:6, badge:'使命題', type:'open',
    question:'師尊老大人問大家：如何讓一位不喜歡沐浴的人想沐浴？',
    timerSec:90,
    explain:{
      title:'真誠以待，愛而不礙',

];

// ═══════════════════════════════════════════════════
// TIMER VARS  —  宣告在最前面避免 temporal dead zone
// ═══════════════════════════════════════════════════
let _timerInterval = null;
let _dispTimer = null;

// ═══════════════════════════════════════════════════
// STATE  —  Firebase 跨裝置即時同步
// ═══════════════════════════════════════════════════
const fbApp = firebase.initializeApp({
  apiKey:"AIzaSyAFlhG3HmDfXo33KJFnQ-k3MhWqt-Km0IY",
  authDomain:"tao-why.firebaseapp.com",
  databaseURL:"https://tao-why-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"tao-why", storageBucket:"tao-why.firebasestorage.app",
  messagingSenderId:"890386342264", appId:"1:890386342264:web:de68c75a2cfe42dab5e88d"
});
const db = firebase.database();
const stateRef = db.ref('state');

const S = { screen:'idle', qIdx:-1, timerRunning:false, timerStart:0, timerDur:0, selectedOpt:null };

async function broadcast(patch) {
  Object.assign(S, patch);
  await stateRef.update(patch);
  if (document.getElementById('page-host')?.classList.contains('active')) {
    renderHostQList();
    renderHostControls();
  }
}

stateRef.on('value', snap => {
  const data = snap.val();
  if (data) Object.assign(S, data);
  if (document.getElementById('page-display')?.classList.contains('active')) {
    renderDisplay();
  }
});

// ═══════════════════════════════════════════════════
// ROUTER
// ═══════════════════════════════════════════════════
window.nav = p => {
  document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
  document.getElementById('page-'+p)?.classList.add('active');
  location.hash = p;
  if (p === 'display') renderDisplay();
};
nav(location.hash.replace('#','') || 'home');

// ═══════════════════════════════════════════════════
// HOST
// ═══════════════════════════════════════════════════
window.unlockHost = () => {
  const pw = document.getElementById('host-pw').value;
  if (pw !== HOST_PW) {
    document.getElementById('host-err').classList.remove('hidden');
    return;
  }
  document.getElementById('host-lock').classList.add('hidden');
  const main = document.getElementById('host-main');
  main.classList.remove('hidden');
  main.style.display = 'flex';
  renderHostQList();
  renderHostControls();
};

function renderHostQList() {
  // Quick jump buttons
  const jc = document.getElementById('h-jump-btns');
  if (jc) {
    jc.innerHTML = Q.map((q, i) => {
      const active = i === S.qIdx;
      return `<button onclick="hostGoQ(${i})"
        class="btn ${active ? 'btn-gold' : 'btn-ghost'}"
        style="padding:8px 14px;font-weight:700;font-size:15px;min-width:42px">${i+1}</button>`;
    }).join('') +
    `<button onclick="if(confirm('重置課程？'))broadcast({screen:'idle',qIdx:-1,timerRunning:false,timerStart:0,selectedOpt:''})"
      class="btn btn-danger" style="padding:8px 12px;margin-left:4px" title="重置">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>`;
  }

  // Question list
  const c = document.getElementById('h-q-list'); if (!c) return;
  c.innerHTML = Q.map((q, i) => {
    const isActive = i === S.qIdx;
    return `<div onclick="hostGoQ(${i})"
      style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;
             background:${isActive ? 'rgba(123,97,255,.15)' : 'rgba(255,255,255,.02)'};
             border:1px solid ${isActive ? 'rgba(123,97,255,.4)' : 'rgba(255,255,255,.06)'};
             transition:all .15s">
      <span style="font-size:11px;color:var(--t3);font-family:'JetBrains Mono',monospace;flex-shrink:0">${String(i+1).padStart(2,'0')}</span>
      <span class="badge ${q.type==='psych-classic'?'badge-gold':'badge-acc'}" style="flex-shrink:0;font-size:10px;padding:2px 8px">${q.badge}</span>
      <span style="font-size:12px;color:${isActive ? 'var(--t1)' : 'var(--t2)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${q.question.slice(0,28)}…</span>
    </div>`;
  }).join('');
  document.getElementById('h-prog').textContent = `${S.qIdx >= 0 ? S.qIdx+1 : 0} / ${Q.length}`;
}

window.hostGoQ = i => {
  clearInterval(_timerInterval);
  broadcast({ screen:'question', qIdx:i, timerRunning:false, timerStart:0, timerDur:Q[i].timerSec, selectedOpt:'' });
};

window.hostSelectOpt = label => {
  broadcast({ selectedOpt: label });
};

function renderHostControls() {
  const c = document.getElementById('h-controls'); if (!c) return;
  const { screen, qIdx, timerRunning, timerDur } = S;
  const q = Q[qIdx];

  const statusMap = { idle:'等待中', question:'出題中', reveal:'揭示中', explain:'解答中' };
  const el = document.getElementById('h-status');
  if (el) el.textContent = statusMap[screen] || '等待中';

  if (screen === 'idle' || qIdx < 0) {
    c.innerHTML = `
      <p class="slabel" style="margin-bottom:10px">開始課程</p>
      <p style="font-size:13px;color:var(--t2);margin-bottom:16px;line-height:1.6">點選上方數字跳到任一題，或直接開始。</p>
      <button onclick="hostGoQ(0)" class="btn btn-gold btn-xl btn-full pulse">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        開始課程（從第 1 題）
      </button>`;
    return;
  }

  const isLast = qIdx >= Q.length - 1;
  const nextBtn = isLast
    ? `<button onclick="broadcast({screen:'idle',qIdx:-1,timerRunning:false,selectedOpt:''})" class="btn btn-ghost btn-lg btn-full" style="margin-bottom:8px">課程結束</button>`
    : `<button onclick="hostGoQ(${qIdx+1})" class="btn btn-gold btn-lg btn-full" style="margin-bottom:8px">下一題：Q${qIdx+2} ${Q[qIdx+1].badge} →</button>`;

  const resetHtml = `
    <div style="height:1px;background:var(--bd);margin:10px 0"></div>
    <button onclick="if(confirm('重置課程？'))broadcast({screen:'idle',qIdx:-1,timerRunning:false,timerStart:0,selectedOpt:''})" class="btn btn-danger btn-full" style="padding:9px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      重置
    </button>`;

  const qInfo = `
    <div style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span class="badge badge-gold">Q${qIdx+1} ${q.badge}</span>
        <span style="font-size:12px;color:var(--t3)">共 ${Q.length} 題</span>
      </div>
      <p style="font-size:13px;color:var(--t2);line-height:1.6">${q.question.slice(0,60)}${q.question.length>60?'…':''}</p>
    </div>
    <div style="height:1px;background:var(--bd);margin-bottom:14px"></div>`;

  // ── 心理測驗 question 狀態 ──
  if (screen === 'question' && q.type === 'psych-classic') {
    c.innerHTML = `${qInfo}
      <button onclick="hostReveal()" class="btn btn-acc btn-xl btn-full" style="margin-bottom:8px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        進入揭示（選擇選項）
      </button>${resetHtml}`;
    return;
  }

  // ── 心理測驗 reveal 狀態 ──
  if (screen === 'reveal' && q.type === 'psych-classic') {
    const optBtns = q.opts.map(o => `
      <button onclick="hostSelectOpt('${o.label}')"
        class="btn ${S.selectedOpt===o.label?'btn-gold':'btn-ghost'}"
        style="flex-direction:column;height:auto;padding:12px 8px;flex:1;min-width:0;gap:4px">
        <span style="font-size:20px;font-weight:700">${o.label}</span>
        <span style="font-size:10px;opacity:.7;white-space:normal;text-align:center;line-height:1.3">${o.text.slice(0,18)}…</span>
      </button>`).join('');
    c.innerHTML = `${qInfo}
      <p class="slabel" style="margin-bottom:10px">點選選項 → 大螢幕顯示對應經典</p>
      <div style="display:flex;gap:6px;margin-bottom:14px">${optBtns}</div>
      ${nextBtn}${resetHtml}`;
    return;
  }

  // ── 一般題 question 狀態 ──
  if (screen === 'question') {
    let timerHtml = '';
    if (q.timerSec > 0) {
      timerHtml = timerRunning
        ? `<button onclick="hostPauseTimer()" class="btn btn-ghost btn-lg btn-full" style="margin-bottom:8px">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            暫停計時
          </button>`
        : `<button onclick="hostStartTimer()" class="btn btn-ghost btn-lg btn-full" style="margin-bottom:8px">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            開始計時 ${fmt(timerDur)}
          </button>`;
    }
    c.innerHTML = `${qInfo}${timerHtml}
      <button onclick="hostExplain()" class="btn btn-acc btn-xl btn-full" style="margin-bottom:8px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        揭示解答
      </button>${resetHtml}`;
    return;
  }

  // ── explain 狀態（所有類型）──
  if (screen === 'explain') {
    c.innerHTML = `${qInfo}${nextBtn}${resetHtml}`;
    return;
  }
}

// ── Timer ─────────────────────────────────────────
window.hostStartTimer = () => {
  broadcast({ timerRunning:true, timerStart:Date.now(), timerDur:Q[S.qIdx].timerSec });
  clearInterval(_timerInterval);
  _timerInterval = setInterval(() => {
    const rem = Math.max(0, S.timerDur - (Date.now()-S.timerStart)/1000);
    if (rem <= 0) { clearInterval(_timerInterval); broadcast({ timerRunning:false }); }
  }, 500);
};

window.hostPauseTimer = () => {
  clearInterval(_timerInterval);
  const rem = Math.max(0, S.timerDur - (Date.now()-S.timerStart)/1000);
  broadcast({ timerRunning:false, timerDur:Math.round(rem), timerStart:0 });
};

window.hostReveal = () => {
  clearInterval(_timerInterval);
  broadcast({ screen:'reveal', timerRunning:false, selectedOpt:'' });
};

window.hostExplain = () => {
  clearInterval(_timerInterval);
  broadcast({ screen:'explain', timerRunning:false });
};

// ═══════════════════════════════════════════════════
// DISPLAY
// ═══════════════════════════════════════════════════
function showPanel(id) {
  document.querySelectorAll('.d-panel').forEach(el => el.style.display = 'none');
  const el = document.getElementById(id);
  if (!el) return;
  el.style.display = id === 'd-question' ? 'flex' : 'block';
  el.style.animation = 'fadeUp .45s ease both';
  setTimeout(() => { if (el) el.style.animation = ''; }, 500);
}

function fmt(sec) {
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function renderDisplay() {
  if (!document.getElementById('page-display')?.classList.contains('active')) return;
  clearInterval(_dispTimer);

  const { screen, qIdx, timerRunning, timerStart, timerDur } = S;
  const q = qIdx >= 0 ? Q[qIdx] : null;

  // ── IDLE ─────────────────────────────────────────
  if (screen === 'idle' || !q) { showPanel('d-idle'); return; }

  // ── QUESTION ─────────────────────────────────────
  if (screen === 'question') {
    showPanel('d-question');
    document.getElementById('d-q-badge').textContent = q.badge;
    document.getElementById('d-q-text').textContent = q.question;

    // Timer
    const tw = document.getElementById('d-q-timer-wrap');
    const te = document.getElementById('d-q-timer');
    if (timerDur > 0) {
      tw.style.display = '';
      const updateTimer = () => {
        const rem = timerRunning && timerStart
          ? Math.max(0, timerDur - (Date.now()-timerStart)/1000)
          : timerDur;
        te.textContent = fmt(rem);
        te.style.color = rem <= 30 ? 'var(--red)' : rem <= 60 ? 'var(--gold)' : 'var(--t1)';
        te.style.textShadow = rem <= 30 ? '0 0 60px rgba(255,69,58,.6)' : '0 0 60px rgba(255,255,255,.3)';
        if (rem <= 0) clearInterval(_dispTimer);
      };
      updateTimer();
      if (timerRunning) _dispTimer = setInterval(updateTimer, 500);
    } else {
      tw.style.display = 'none';
    }

    // Options (psych-classic only)
    const oc = document.getElementById('d-q-opts');
    if (q.type === 'psych-classic') {
      oc.innerHTML = q.opts.map(o => `
        <div style="display:flex;align-items:flex-start;gap:clamp(.8rem,2vw,1.5rem);
                    padding:clamp(.7rem,1.8vh,1rem) clamp(1rem,2.5vw,1.6rem);
                    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px">
          <span class="d-opt-label" style="color:var(--gold-hi);flex-shrink:0">${o.label}</span>
          <span class="d-opt-text" style="color:var(--t2)">${o.text}</span>
        </div>`).join('');
      document.getElementById('d-q-hint').style.display = '';
      document.getElementById('d-q-hint').textContent = '💬 請在聊天室回覆 A / B / C / D';
    } else {
      oc.innerHTML = '';
      document.getElementById('d-q-hint').style.display = 'none';
    }
    return;
  }

  // ── REVEAL: 心理測驗 ─────────────────────────────
  if (screen === 'reveal' && q.type === 'psych-classic') {
    showPanel('d-reveal-classic');
    const rc = document.getElementById('d-reveal-classic');
    const opt = S.selectedOpt ? q.opts.find(o => o.label === S.selectedOpt) : null;

    if (!opt) {
      rc.innerHTML = `
        <div style="text-align:center;padding:clamp(40px,8vh,80px) 20px">
          <p style="color:var(--t2);font-size:clamp(1.2rem,2.5vw,2rem);margin-bottom:clamp(2rem,5vh,4rem)">選擇一個選項，看看對應的智慧 ✨</p>
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(.6rem,1.5vw,1.2rem);max-width:800px;margin:0 auto;opacity:.45">
            ${q.opts.map(o => `
              <div style="padding:clamp(1rem,2.5vw,1.5rem);border:1px solid rgba(255,255,255,.1);border-radius:12px;text-align:left">
                <span style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(1.5rem,3.5vw,2.5rem);color:var(--gold-hi)">${o.label}</span>
                <p style="font-size:clamp(.85rem,1.7vw,1.3rem);color:var(--t2);margin-top:.5rem;line-height:1.5">${o.text}</p>
              </div>`).join('')}
          </div>
        </div>`;
    } else {
      rc.innerHTML = `
        <div class="ani-up" style="max-width:880px;margin:0 auto">
          <div style="margin-bottom:clamp(1.5rem,4vh,3rem)">
            <span style="font-family:'JetBrains Mono',monospace;font-weight:700;
                         font-size:clamp(3rem,7vw,5.5rem);color:var(--gold-hi);
                         text-shadow:0 0 60px rgba(255,208,96,.4)">${opt.label}</span>
            <p class="d-q" style="color:var(--t2);margin-top:.5rem">${opt.text}</p>
          </div>
          <div style="height:1px;background:linear-gradient(to right,transparent,rgba(255,255,255,.2),transparent);
                      margin-bottom:clamp(1.5rem,4vh,3rem)"></div>
          <div style="text-align:center">
            <div class="d-classic-source" style="margin-bottom:clamp(.8rem,2vh,1.5rem)">${opt.classic}</div>
            <div class="d-classic-quote" style="white-space:pre-line">${opt.quote}</div>
          </div>
        </div>`;
    }
    return;
  }

  // ── REVEAL for open/video: fall through to explain ──
  if (screen === 'reveal' && q.type !== 'psych-classic') {
    broadcast({ screen:'explain' });
    return;
  }

  // ── EXPLAIN（open / video）────────────────────────
  if (screen === 'explain') {
    showPanel('d-explain');
    const ec = document.getElementById('d-explain-content');

    // Video type
    if (q.type === 'video') {
      ec.style.gridTemplateColumns = '1fr';
      ec.innerHTML = `
        <div style="max-width:960px;margin:0 auto;width:100%">
          <span class="badge badge-gold" style="margin-bottom:clamp(.8rem,2vh,1.2rem);font-size:clamp(.8rem,1.4vw,1rem);padding:5px 14px">
            Q${qIdx+1} ${q.badge} — 解答
          </span>
          <video src="${q.explain.video}" controls playsinline
                 style="width:100%;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--bd);
                        margin-top:clamp(.8rem,2vh,1.2rem);background:#000"></video>
          ${q.explain.supplement ? `
            <p class="d-supplement ani-up" style="margin-top:clamp(1rem,3vh,2rem)">${q.explain.supplement}</p>
          ` : ''}
        </div>`;
      return;
    }

    // Open type
    const { title, text, image, supplement } = q.explain;
    const hasImage = !!image;

    if (hasImage) {
      ec.style.gridTemplateColumns = 'minmax(0,1.1fr) minmax(0,.9fr)';
      ec.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:clamp(.8rem,2vh,1.5rem)">
          <span class="badge badge-gold" style="font-size:clamp(.8rem,1.4vw,1rem);padding:5px 14px;align-self:flex-start">
            Q${qIdx+1} ${q.badge} — 解答
          </span>
          ${title ? `<h2 style="font-size:clamp(1.3rem,2.8vw,2.4rem);font-weight:700;color:var(--gold-hi);line-height:1.3">${title}</h2>` : ''}
          <p class="d-explain-text ani-up" style="white-space:pre-line">${text}</p>
          ${supplement ? `<p class="d-supplement" style="text-align:left;margin-top:clamp(.5rem,1.5vh,1rem)">${supplement}</p>` : ''}
        </div>
        <div style="display:flex;align-items:center;justify-content:center">
          <img src="${image}" alt="" class="ani-sc"
               style="width:100%;max-height:70vh;object-fit:cover;border-radius:14px;
                      border:1px solid var(--bd);box-shadow:0 8px 40px rgba(0,0,0,.4)">
        </div>`;
    } else {
      ec.style.gridTemplateColumns = '1fr';
      ec.innerHTML = `
        <div style="max-width:880px;margin:0 auto">
          <span class="badge badge-gold" style="margin-bottom:clamp(.8rem,2vh,1.5rem);font-size:clamp(.8rem,1.4vw,1rem);padding:5px 14px">
            Q${qIdx+1} ${q.badge} — 解答
          </span>
          ${title ? `<h2 style="font-size:clamp(1.4rem,3vw,2.6rem);font-weight:700;color:var(--gold-hi);margin-top:clamp(.8rem,2vh,1.5rem);line-height:1.3">${title}</h2>` : ''}
          <p class="d-explain-text ani-up" style="white-space:pre-line;margin-top:clamp(.8rem,2vh,1.5rem)">${text}</p>
          ${supplement ? `<p class="d-supplement" style="margin-top:clamp(1rem,3vh,2rem)">${supplement}</p>` : ''}
        </div>`;
    }
    return;
  }
  // Fallback: unknown state → show idle
  showPanel('d-idle');
}
</script>
